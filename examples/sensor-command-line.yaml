# Frigate AI Event Card — command_line sensor
#
# This is the RECOMMENDED approach. It uses curl to fetch Frigate events and
# pipes them through frigate_events.py, which caches snapshots locally so
# thumbnails load without cross-origin auth issues.
#
# HOW IT WORKS
# ------------
# curl fetches the raw Frigate events JSON, then piped to frigate_events.py
# which: (1) downloads each snapshot to /config/www/frigate_thumbnails/,
# (2) reshapes the JSON into the shape the card expects, and (3) prints the
# result to stdout for HA to parse as sensor attributes.
#
# IMPORTANT: HA's command_line platform does NOT expand !secret tags inside
# the command string. Store your JWT in a shell environment variable or a
# plain-text file readable by HA. The recommended approach is a wrapper script
# (see below).
#
# HOW TO USE
# ----------
# 1. Generate a Frigate JWT (see docs/sensor-setup.md for the full command).
#
# 2. Create a wrapper script at /config/scripts/fetch_frigate_events.sh:
#
#      #!/bin/sh
#      FRIGATE_BASE_URL="https://YOUR_FRIGATE_HOST:8971"
#      FRIGATE_JWT="eyJ...your_token_here..."
#      curl -sk \
#        -H "Authorization: Bearer $FRIGATE_JWT" \
#        "$FRIGATE_BASE_URL/api/events?limit=20&has_clip=1&camera=YOUR_CAMERA_NAME" \
#      | FRIGATE_BASE_URL="$FRIGATE_BASE_URL" FRIGATE_JWT="$FRIGATE_JWT" \
#        python3 /config/scripts/frigate_events.py
#
# 3. Make it executable:
#      chmod +x /config/scripts/fetch_frigate_events.sh
#
# 4. Add the sensor below to configuration.yaml and restart HA.

command_line:
  - sensor:
      name: "Frigate Camera Driveway Events"
      unique_id: frigate_camera_driveway_events
      scan_interval: 30
      command: "/bin/sh /config/scripts/fetch_frigate_events.sh"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - count
        - events

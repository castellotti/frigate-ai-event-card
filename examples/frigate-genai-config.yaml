# Frigate GenAI configuration snippets
#
# These go in /srv/frigate/config/config.yml and require Frigate 0.17+.
# Pick ONE provider block and add it to your Frigate config.
# Each block is self-contained — only one genai: key is supported per config.
#
# Docs: https://docs.frigate.video/configuration/genai/

# ── Option A: Ollama (local, recommended for privacy) ────────────────────────
genai:
  enabled: true
  provider: ollama
  base_url: http://YOUR_OLLAMA_HOST:11434
  model: qwen2-vl:7b-instruct   # or llava, llava-phi3, moondream, etc.
  prompt: >
    Analyze this security camera image and describe what you see in 1-2 sentences.
    Focus on people, vehicles, and notable activity. Be concise and factual.


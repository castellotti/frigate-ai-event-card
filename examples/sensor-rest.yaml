# Frigate AI Event Card — REST sensor template
#
# HOW TO USE
# ----------
# 1. Generate a Frigate JWT:
#      curl -sk -X POST "https://YOUR_FRIGATE_HOST:8971/api/login" \
#        -H "Content-Type: application/json" \
#        -d '{"user": "YOUR_FRIGATE_USER", "password": "YOUR_FRIGATE_PASSWORD"}' \
#        -c - | grep frigate_token | awk '{print $NF}'
#
# 2. Add the token to secrets.yaml:
#      frigate_jwt_token: eyJ...
#
# 3. Copy the sensor block below into configuration.yaml (under a `rest:` key)
#    or into a separate included file.
#
# 4. Install frigate_events.py to /config/scripts/ (see examples/frigate_events.py).
#
# 5. Restart Home Assistant (rest sensors require a full restart).
#
# NOTE: verify_ssl: false is needed because Frigate typically uses a self-signed
# certificate. If your Frigate instance has a trusted cert, remove that line.

rest:
  - scan_interval: 30
    resource: "https://YOUR_FRIGATE_HOST:8971/api/events?limit=20&has_clip=1&camera=YOUR_CAMERA_NAME"
    headers:
      Authorization: "Bearer !secret frigate_jwt_token"
    verify_ssl: false
    sensor:
      - name: "Frigate Camera Front Events"
        unique_id: frigate_camera_front_events
        # The value_template sets the sensor state to the event count.
        # Attributes are populated by the command_line preprocessor below.
        value_template: "{{ value_json | length }}"
        # Pipe the raw Frigate JSON through the preprocessor, which caches
        # snapshots locally and reshapes the payload for the card.
        # Remove the command line if you prefer to shape the JSON inline via
        # value_template / json_attributes_path instead.
        command: "python3 /config/scripts/frigate_events.py"
        json_attributes_path: "$"
        json_attributes:
          - count
          - events

# Frigate AI Event Card — REST sensor template
#
# HOW IT WORKS
# ------------
# The REST sensor fetches the raw Frigate events JSON every 30 seconds and
# stores it as sensor attributes. Because HA's rest: platform does not support
# piping the response through an external script, the reshaping (snapshot
# caching, field mapping) must happen in a value_template inline OR you should
# use the command_line sensor variant (sensor-command-line.yaml) which calls
# curl + frigate_events.py together.
#
# This file shows the pure REST approach using a value_template to extract
# what the card needs directly from the raw Frigate response. If you want
# snapshot caching (recommended for thumbnail auth — see docs/sensor-setup.md),
# use sensor-command-line.yaml instead.
#
# HOW TO USE
# ----------
# 1. Generate a Frigate JWT:
#      curl -sk -X POST "https://YOUR_FRIGATE_HOST:8971/api/login" \
#        -H "Content-Type: application/json" \
#        -d '{"user": "YOUR_FRIGATE_USER", "password": "YOUR_FRIGATE_PASSWORD"}' \
#        -c - | grep frigate_token | awk '{print $NF}'
#
# 2. Add the token to secrets.yaml:
#      frigate_jwt_token: eyJ...
#
# 3. Copy this sensor block into configuration.yaml (under a `rest:` key)
#    or into a separate included file.
#
# 4. Restart Home Assistant (rest sensors require a full restart).
#
# NOTE: verify_ssl: false is needed if Frigate uses a self-signed certificate.
# Remove it if your Frigate instance has a trusted cert.
#
# NOTE: thumbnail_url here points directly at Frigate. This works only if the
# browser holds a valid frigate_token cookie. For reliable same-origin
# thumbnails, use the command_line approach with frigate_events.py which
# caches snapshots to /config/www/. See docs/sensor-setup.md.

rest:
  - scan_interval: 30
    resource: "https://YOUR_FRIGATE_HOST:8971/api/events?limit=20&has_clip=1&camera=YOUR_CAMERA_NAME"
    headers:
      Authorization: "Bearer !secret frigate_jwt_token"
    verify_ssl: false
    sensor:
      - name: "Frigate Camera Front Events"
        unique_id: frigate_camera_front_events
        value_template: "{{ value_json | length }}"
        json_attributes_path: "$"
        json_attributes:
          - events
